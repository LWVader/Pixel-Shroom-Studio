<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Protected AI artwork by genre.">
<title>Pixel Shroom Studio Genre</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- SECTION: Genre page header -->
<header class="genre-header">
<div class="shell">
<a class="brand" href="/">
<img class="brand-logo" src="/assets/pixel-shroom-logo.jpg" alt="Pixel Shroom Studio logo">
<span>Pixel Shroom <b>Studio</b></span>
</a>
</div>
</header>
<main class="shell genre-page">
<nav class="genre-breadcrumb">
<a href="/">Pixel Shroom Studio</a>
<span>›</span>
<strong id="genre-crumb">Genre</strong>
</nav>
<!-- SECTION: Genre title and purchase description -->
<section class="genre-hero">
<span>CURATED GENRE</span>
<h1 id="genre-title">Artwork</h1>
<p id="genre-description">
</p>
</section>
<nav class="genre-tabs" id="genre-tabs">
</nav>
<!-- SECTION: Genre-specific individual artwork listings -->
<section class="gallery-section genre-listings">
<div class="section-heading">
<div>
<span>GENRE COLLECTION</span>
<h2 id="genre-count">Loading listings…</h2>
</div>
</div>
<div class="product-grid" id="genre-catalog">
</div>
</section>
</main>
<!-- SECTION: Discreet owner access button -->
<div class="owner-access-row">
<a class="owner-access" href="/admin.html" aria-label="Open private owner access">
<img src="/assets/pixel-shroom-logo.jpg" alt="">
</a>
</div>
<script src="/genre.js" defer>
</script>
</body>
</html>
